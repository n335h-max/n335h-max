name: Update contribution snake

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#009f9a&color_dots=#eef9f8,#c9ece9,#8dd7d0,#43b5ad,#087c80
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5ce2d1&color_dots=#0e2031,#174356,#216c73,#2d9b96,#61d2bd

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'Update contribution snake'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
