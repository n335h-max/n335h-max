<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">A path through ideas</title>
  <desc id="desc">A teal path winds across a dark grid of rounded squares with soft glows and small stars.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1729"/>
      <stop offset="1" stop-color="#102b3c"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#278d9c"/>
      <stop offset="0.55" stop-color="#49c4b7"/>
      <stop offset="1" stop-color="#9af5db"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect x="8" y="8" width="28" height="28" rx="7" fill="none" stroke="#24445a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#53d8cb" stop-opacity=".28"/>
      <stop offset="1" stop-color="#53d8cb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="240" rx="24" fill="url(#background)"/>
  <rect width="1200" height="240" rx="24" fill="url(#grid)" opacity=".72"/>
  <circle cx="305" cy="142" r="230" fill="url(#glow)"/>
  <circle cx="1015" cy="95" r="210" fill="url(#glow)"/>
  <g fill="#2a847f" opacity=".72">
    <rect x="96" y="96" width="28" height="28" rx="7"/>
    <rect x="140" y="96" width="28" height="28" rx="7"/>
    <rect x="184" y="96" width="28" height="28" rx="7"/>
    <rect x="404" y="140" width="28" height="28" rx="7"/>
    <rect x="448" y="140" width="28" height="28" rx="7"/>
    <rect x="624" y="52" width="28" height="28" rx="7"/>
    <rect x="844" y="140" width="28" height="28" rx="7"/>
    <rect x="888" y="140" width="28" height="28" rx="7"/>
    <rect x="932" y="140" width="28" height="28" rx="7"/>
  </g>
  <path d="M52 154H271Q294 154 294 131V87Q294 64 317 64H535Q558 64 558 87V175Q558 198 581 198H755Q778 198 778 175V109Q778 86 801 86H1104" fill="none" stroke="#071b2b" stroke-width="27" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  <path d="M52 154H271Q294 154 294 131V87Q294 64 317 64H535Q558 64 558 87V175Q558 198 581 198H755Q778 198 778 175V109Q778 86 801 86H1104" fill="none" stroke="url(#trail)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#bafbe8">
